<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Dynamic Grid</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(-45deg, #0f0c20, #15103c, #091a3a, #03001e); background-size: 400% 400%; animation: gradientBG 15s ease infinite; overflow-x: hidden; color: #fff; padding: 2rem; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        
        /* Grid Layout for containers */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem; max-width: 1200px; width: 100%; justify-content: center; }
        
        /* Container styling with entry animation */
        .container { position: relative; height: 180px; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.03); border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); opacity: 0; transform: translateY(30px); animation: fadeInUp 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .container:hover { transform: translateY(-10px) scale(1.02); border-color: rgba(0, 198, 255, 0.6); box-shadow: 0 0 25px rgba(0, 198, 255, 0.4), 0 0 50px rgba(114, 4, 255, 0.2); }
        
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
        
        /* Staggered animation delays */
        .container:nth-child(1) { animation-delay: 0.5s; }
        .container:nth-child(2) { animation-delay: 0.75s; }
        .container:nth-child(3) { animation-delay: 1.0s; }
        .container:nth-child(4) { animation-delay: 1.25s; }

        .copy-btn { padding: 12px 30px; font-size: 1rem; font-weight: 600; color: #fff; background: linear-gradient(135deg, #7209b7, #3f37c9); border: none; border-radius: 30px; cursor: pointer; box-shadow: 0 4px 15px rgba(114, 9, 183, 0.4); transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px; }
        .copy-btn:hover { background: linear-gradient(135deg, #3f37c9, #4895ef); box-shadow: 0 6px 20px rgba(72, 149, 239, 0.6); transform: translateY(-2px); }
        .copy-btn:active { transform: translateY(1px); }
    </style>
</head>
<body>
    <div class="grid">
        <!-- Container with the one-line copy button inside -->
        <div class="container">
          <h1>XAND is the way: Gates that use XOR and XNOR.</h1>
            <button class="copy-btn" onclick="navigator.clipboard.writeText('15,0,-2,0,1,;15,0,2,0,0,;3,0,0,0,2,;15,0,0,0,0,;13,0,-2,1,1,50;15,0,-2,0,0,;13,0,2,1,0,79;13,0,-2,1,0,49?1,4;1,3;3,2;4,3;6,3;6,4??').then(() => { const original = this.innerText; this.innerText = 'Copied!'; setTimeout(() => this.innerText = original, 1500); })">AND Gate</button>
        </div>
        
        <!-- Additional placeholder containers to demonstrate the grid and staggered animation sequence -->
        <div class="container"></div>
        <div class="container"></div>
        <div class="container"></div>
    </div>
</body>
  </html>
